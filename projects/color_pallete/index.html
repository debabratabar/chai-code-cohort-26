<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Pallete Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/chai_icon.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <img src="assets/chai_icon.png" alt="chai-icon" height="200px" width="200px">
        <h1>Color Pallete Generator</h1>


        <div class="controls">
            <select name="coloe-val" id="color-val">
            <option value="hex">HEX</option>
            <option value="rgb">RGB</option>
        </select> 

            <select name="theme" id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
             <option value="all">All Colors</option>
        </select> 

        <button id="generate" >Generate</button>

        </div>



         <div id="palette" class="palette">

        </div>


        </div>

        

       


    
    <script src="main.js"></script>
</body>
</html>
